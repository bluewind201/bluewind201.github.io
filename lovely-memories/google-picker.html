<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lovely memories · Google Drive Picker</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #cbd5e1;
        line-height: 1.5;
        margin: 0 0 18px;
      }
      button,
      .btn-link {
        display: block;
        box-sizing: border-box;
        text-decoration: none;
        background: #10b981;
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
      }
      .btn-link {
        margin-top: 10px;
        background: #0284c7;
      }
      button:disabled {
        background: #475569;
        cursor: not-allowed;
      }
      .muted {
        margin-top: 12px;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
    <script src="https://apis.google.com/js/api.js"></script>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Google Drive 사진 선택</h1>
      <p id="status">Google Picker를 불러오는 중입니다. 잠시만 기다려 주세요.</p>
      <button id="openBtn" disabled>사진 선택 창 열기</button>
      <a id="returnLink" class="btn-link" href="com.bluewind.lovelymemories://cloud-auth" style="display: none;">앱으로 돌아가기</a>
      <div class="muted" id="sub">drive.file 최소 권한 · 선택한 사진만 앱에 연결됩니다.</div>
    </div>

    <script>
      (function () {
        var statusEl = document.getElementById('status');
        var openBtn = document.getElementById('openBtn');
        var returnLink = document.getElementById('returnLink');

        function parseHashParams() {
          var hash = window.location.hash ? window.location.hash.slice(1) : '';
          var query = window.location.search ? window.location.search.slice(1) : '';
          return new URLSearchParams(hash || query);
        }

        var params = parseHashParams();
        var accessToken = params.get('access_token') || '';
        var developerKey = params.get('developer_key') || '';
        var appId = params.get('app_id') || '';
        var redirectUri = params.get('redirect_uri') || 'com.bluewind.lovelymemories://cloud-auth';
        var state = params.get('state') || '';
        var lang = params.get('lang') || 'ko';

        function isSafeRedirect(uri) {
          return (
            uri.indexOf('com.bluewind.lovelymemories://') === 0 ||
            uri.indexOf('http://localhost') === 0 ||
            uri.indexOf('https://localhost') === 0
          );
        }

        function returnToApp(extraHash) {
          var safeUri = isSafeRedirect(redirectUri)
            ? redirectUri
            : 'com.bluewind.lovelymemories://cloud-auth';
          var target =
            safeUri +
            '#source=google_picker&state=' +
            encodeURIComponent(state) +
            (extraHash ? '&' + extraHash : '');
          if (returnLink) {
            returnLink.href = target;
            returnLink.style.display = 'block';
          }
          try {
            window.location.href = target;
          } catch (e) {
            window.location.replace(target);
          }
        }

        if (!accessToken || !developerKey || !appId) {
          statusEl.textContent = 'Google Picker 실행에 필요한 인증 정보가 누락되었습니다.';
          openBtn.disabled = false;
          openBtn.textContent = '앱으로 돌아가기';
          openBtn.onclick = function () {
            returnToApp('error=missing_params');
          };
          return;
        }

        function openPicker() {
          try {
            var docsView = new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES_AND_VIDEOS)
              .setIncludeFolders(true)
              .setSelectFolderEnabled(false)
              .setMode(google.picker.DocsViewMode.GRID);

            var imagesView = new google.picker.DocsView(google.picker.ViewId.DOCS_IMAGES)
              .setIncludeFolders(true)
              .setSelectFolderEnabled(false)
              .setMode(google.picker.DocsViewMode.GRID);

            var origin = window.location.protocol + '//' + window.location.host;
            var builder = new google.picker.PickerBuilder()
              .setTitle('Lovely memories에 표시할 사진·영상 선택')
              .setLocale(lang)
              .setOrigin(origin)
              .setOAuthToken(accessToken)
              .setDeveloperKey(developerKey)
              .setAppId(appId)
              .enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
              .addView(docsView)
              .addView(imagesView);

            builder.setCallback(function (data) {
              if (data.action === google.picker.Action.PICKED) {
                var docs = Array.isArray(data.docs) ? data.docs : [];
                var ids = docs
                  .map(function (d) {
                    return d && d.id ? String(d.id) : '';
                  })
                  .filter(Boolean);
                var folderName =
                  (docs[0] && docs[0].parentId) || 'Google Drive 선택 앨범';
                statusEl.textContent =
                  ids.length + '개 항목을 선택했습니다. 앱으로 돌아갑니다...';
                returnToApp(
                  'picked_ids=' +
                    encodeURIComponent(ids.join(',')) +
                    '&label=' +
                    encodeURIComponent(folderName)
                );
              } else if (data.action === google.picker.Action.CANCEL) {
                statusEl.textContent = '선택이 취소되었습니다. 앱으로 돌아갑니다...';
                returnToApp('error=cancelled');
              }
            });

            var picker = builder.build();
            picker.setVisible(true);
            statusEl.textContent = '사진을 선택한 뒤 확인을 누르면 자동으로 앱으로 돌아갑니다.';
          } catch (err) {
            statusEl.textContent = 'Picker 실행 오류: ' + (err && err.message ? err.message : err);
            openBtn.disabled = false;
            openBtn.textContent = '앱으로 돌아가기';
            openBtn.onclick = function () {
              returnToApp('error=picker_init_failed');
            };
          }
        }

        function onPickerLoaded() {
          openBtn.disabled = false;
          openBtn.textContent = '사진 선택 창 다시 열기';
          openBtn.onclick = openPicker;
          openPicker();
        }

        if (window.gapi && typeof window.gapi.load === 'function') {
          window.gapi.load('picker', { callback: onPickerLoaded });
        } else {
          window.addEventListener('load', function () {
            if (window.gapi && typeof window.gapi.load === 'function') {
              window.gapi.load('picker', { callback: onPickerLoaded });
            } else {
              statusEl.textContent = 'Google Picker 스크립트를 불러오지 못했습니다.';
              openBtn.disabled = false;
              openBtn.textContent = '앱으로 돌아가기';
              openBtn.onclick = function () {
                returnToApp('error=script_load_failed');
              };
            }
          });
        }
      })();
    </script>
  </body>
</html>
